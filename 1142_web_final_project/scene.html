<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>逃婚門</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-screen">

  <!-- 手機直屏提示 -->
  <div id="rotate-prompt">
    <p>請將手機橫置以獲得最佳體驗</p>
    <div class="rotate-icon">⟳</div>
  </div>

  <!-- 場景背景 -->
  <div id="scene-bg"></div>

  <!-- 角色立繪：獨立於對話框外，以 CSS 對齊對話框頂端 -->
  <div id="character-wrap">
    <img id="character-sprite" src="" alt="" style="display:none">
  </div>

  <!-- 底部對話橫條（dialog.png 2536×416） -->
  <div id="dialog-card">
    <div id="dialog-content" class="has-speaker">
      <!-- 說話者名稱（疊在 dialog.png 左上角標籤區） -->
      <div id="speaker-bar" style="display:flex">
        <span id="speaker-name">店員</span>
      </div>

      <!-- 旁白 / 描述框 -->
      <div id="narration-box" style="display:none">
        <p id="narration-text"></p>
      </div>

      <!-- 對話文字 -->
      <p id="dialog-text">對話對話</p>

      <!-- 選項按鈕群 -->
      <div id="choices" style="display:none"></div>

      <!-- 點擊繼續提示 -->
      <div id="next-hint" class="blink">▼</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <button id="hud-menu" onclick="toggleMenu()">
      <img src="public/menu_button.png" alt="選單">
    </button>
    <button id="hud-volume" onclick="toggleVolume(); event.stopPropagation();">
      <img id="hud-volume-icon" src="public/volume_button.png" alt="音效">
    </button>
  </div>

  <!-- 音量面板（點音量鍵後展開） -->
  <div id="volume-panel" style="display:none">
    <span class="vol-label">音量</span>
    <input type="range" id="volume-slider" min="0" max="100" step="1" value="100"
           onclick="event.stopPropagation();">
    <span class="vol-label" id="vol-pct">100%</span>
  </div>

  <!-- 選單覆蓋層 -->
  <div id="menu-overlay" style="display:none">
    <div id="menu-panel">
      <img src="public/menu.png" alt="">
      <div id="menu-items">
        <button class="menu-btn" onclick="toggleMenu()">
          <img src="public/menu_selec.png" alt=""><span>繼續</span>
        </button>
        <button class="menu-btn" onclick="saveGame()">
          <img src="public/menu_selec.png" alt=""><span>存檔</span>
        </button>
        <button class="menu-btn" onclick="backToTitle()">
          <img src="public/menu_selec.png" alt=""><span>回標題</span>
        </button>
      </div>
    </div>
  </div>

  <audio id="bgm" loop></audio>
  <audio id="sfx" ></audio>

  <script src="js/dialogueData.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
