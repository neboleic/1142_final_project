<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>壞結局</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="ending-page ending-bad">
  <div class="ending-scrim" aria-hidden="true"></div>
  <div class="ending-content">
    <!-- TODO: 放 ending_bad.png 至 public/ -->
    <img class="ending-img" src="../../public/ending_bad.png" alt="壞結局">
    <div class="ending-title">✦ 壞結局 ✦</div>
    <p class="ending-desc">
      被顧北辰發現。<br>
      許以安被迫抓回去聽他講了整整三個小時的霸總語錄，<br>
      精神崩潰。
    </p>
    <audio autoplay loop id="bgm">
      <!-- <source src="../../public/bgm_bad.mp3"> -->
    </audio>
    <audio id="btn-sfx" src="../../public/button_sound.mp3"></audio>
    <button class="btn-back" onclick="playBtnSound(); window.location.href='../../index.html'">再試一次</button>
  </div>
  <script>
    function playBtnSound() {
      const s = document.getElementById('btn-sfx');
      s.currentTime = 0;
      s.play().catch(() => {});
    }
  </script>
</body>
</html>
