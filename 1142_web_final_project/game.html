<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>逃婚密室</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-screen">

  <!-- 手機直屏提示 -->
  <div id="rotate-prompt">
    <p>請將手機橫置以獲得最佳體驗</p>
    <div class="rotate-icon">⟳</div>
  </div>

  <!-- 場景背景 -->
  <div id="scene-bg"></div>

  <!-- 角色立繪 -->
  <div id="character-wrap">
    <img id="character-sprite" src="" alt="" style="display:none">
  </div>

  <!-- 右側對話卡片 -->
  <div id="dialog-card">
    <img id="dialog-bg" src="public/menu.png" alt="">

    <div id="dialog-content">
      <!-- 說話者名稱列 -->
      <div id="speaker-bar" style="display:none">
        <img src="public/bar.png" alt="">
        <span id="speaker-name"></span>
      </div>

      <!-- 旁白 / 描述框 -->
      <div id="narration-box" style="display:none">
        <p id="narration-text"></p>
      </div>

      <!-- 對話文字 -->
      <p id="dialog-text"></p>

      <!-- 選項按鈕群 -->
      <div id="choices" style="display:none"></div>

      <!-- 點擊繼續提示 -->
      <div id="next-hint" class="blink">▼</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <button id="hud-menu" onclick="toggleMenu()">
      <img src="public/menu_button.png" alt="選單">
    </button>
    <button id="hud-save" onclick="saveGame()">
      <img src="public/storage.png" alt="存檔">
    </button>
    <button id="hud-volume" onclick="toggleVolume()">
      <img id="hud-volume-icon" src="public/volume_button_open.png" alt="音效">
    </button>
  </div>

  <!-- 選單覆蓋層 -->
  <div id="menu-overlay" style="display:none">
    <div id="menu-panel">
      <img src="public/menu.png" alt="">
      <div id="menu-items">
        <button class="menu-btn" onclick="toggleMenu()">
          <img src="public/menu_selec.png" alt=""><span>繼續</span>
        </button>
        <button class="menu-btn" onclick="saveGame()">
          <img src="public/menu_selec.png" alt=""><span>存檔</span>
        </button>
        <button class="menu-btn" onclick="backToTitle()">
          <img src="public/out.png" alt=""><span>回標題</span>
        </button>
      </div>
    </div>
  </div>

  <audio id="bgm" loop></audio>
  <audio id="sfx"></audio>

  <script src="js/dialogueData.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
