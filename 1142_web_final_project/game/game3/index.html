<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>第三關｜找出正確照片</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper: #ead6ad;
      --paper-dark: #c9a974;
      --ink: #fffaf0;
      --coffee: #6f4e37;
      --danger: #dc2626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--ink);
      background: #17120f url("/game/game3/bg.png") center / cover no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, .18);
      transition: background .35s ease;
    }

    body.choosing::before { background: rgba(0, 0, 0, .45); }

    .stage {
      position: relative;
      z-index: 1;
      width: min(1280px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px clamp(18px, 4vw, 40px);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }

    .timer {
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 800;
      line-height: 1;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .55);
    }

    .timer.warning { color: #ffb4a8; }

    .progress {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .lamp {
      width: 22px;
      height: 22px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      background: rgba(70, 70, 78, .58);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35);
      transition: background .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .lamp.on {
      border-color: #fde68a;
      background: radial-gradient(circle at 30% 30%, #fff3a8 0%, #facc15 55%, #b45309 100%);
      box-shadow: 0 0 14px 2px rgba(250, 204, 21, .88), inset 0 0 4px rgba(255, 255, 255, .62);
    }

    .prompt {
      margin: 12px 0 24px;
      text-align: center;
      font-size: clamp(15px, 1.8vw, 20px);
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .7);
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 3vw, 34px);
      align-items: center;
    }

    .photo-frame {
      position: relative;
      aspect-ratio: 1;
      padding: 14px;
      overflow: hidden;
      background: linear-gradient(135deg, #f3e3c2 0%, #e7d2a8 50%, var(--paper-dark) 100%);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, .45),
        inset 0 0 0 2px rgba(120, 80, 30, .35),
        inset 0 0 18px rgba(0, 0, 0, .25);
    }

    .photo {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .22);
    }

    .finding .photo { cursor: crosshair; }

    .photo > img {
      position: absolute;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .base {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .piece { height: auto; }

    .found-circle {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      border: 3px solid #ef4444;
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 0 12px rgba(239, 68, 68, .62);
    }

    .check-btn {
      position: absolute;
      left: 50%;
      bottom: 10%;
      z-index: 8;
      min-width: 150px;
      padding: 12px 38px;
      color: white;
      font-size: 20px;
      font-weight: 800;
      background: rgba(39, 39, 42, .92);
      border: 1px solid rgba(0, 0, 0, .4);
      border-radius: 6px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
      transform: translateX(-50%);
      cursor: pointer;
    }

    .check-btn:hover { background: rgba(63, 63, 70, .95); }
    .check-btn:active { transform: translateX(-50%) scale(.96); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .85);
      backdrop-filter: blur(4px);
    }

    .overlay.show { display: grid; }

    .result {
      width: min(560px, 92vw);
      padding: 30px;
      text-align: center;
      color: #17130f;
      background: #efe1c4;
      border: 3px solid #050607;
      box-shadow: 12px 14px 0 rgba(0, 0, 0, .35);
    }

    .result.fail-screen {
      color: white;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .result h2 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 72px);
      line-height: 1;
    }

    .result.fail-screen h2 {
      color: var(--danger);
      font-size: clamp(74px, 18vw, 160px);
      letter-spacing: .08em;
      text-shadow: 0 0 24px rgba(220, 38, 38, .9), 0 6px 14px rgba(0, 0, 0, .7);
      -webkit-text-stroke: 3px rgba(0, 0, 0, .45);
    }

    .result p {
      margin: 0 0 22px;
      line-height: 1.7;
      font-weight: 700;
    }

    .result.fail-screen p { color: #f8e4e4; }

    .result button {
      min-width: 132px;
      padding: 12px 18px;
      color: white;
      background: var(--coffee);
      border: 2px solid #050607;
      border-radius: 6px;
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 4px 5px 0 rgba(0, 0, 0, .34);
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .stage { min-height: 100svh; padding: 18px 14px 28px; }
      .hud { grid-template-columns: 1fr auto; }
      .hud > div:first-child { display: none; }
      .progress { gap: 8px; }
      .lamp { width: 18px; height: 18px; }
      .photos { grid-template-columns: 1fr; }
      .check-btn { min-width: 128px; padding-inline: 24px; }
    }
  </style>
</head>
<body class="finding">
  <main class="stage">
    <header class="hud">
      <div></div>
      <div class="timer" id="timer">0:30</div>
      <div class="progress" id="progress" aria-label="找到差異進度"></div>
    </header>

    <p class="prompt" id="prompt">請找出四處不同的地方，並找出正確的照片</p>

    <section class="photos" aria-label="找不同照片">
      <article class="photo-frame">
        <div class="photo" data-side="left" aria-label="左邊照片"></div>
      </article>
      <article class="photo-frame">
        <div class="photo" data-side="right" aria-label="右邊照片"></div>
      </article>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <section class="result" id="result">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <button id="result-btn" type="button">返回主線</button>
    </section>
  </div>

  <script>
    const TOTAL_SECONDS = 30;
    const TOTAL_DIFFERENCES = 4;
    const CORRECT_SIDE = 'left';
    const RETURN_TO = localStorage.getItem('gameReturnTo') || '../../scene.html';

    const filters = {
      painting: 'sepia(0.4) saturate(0.75) brightness(0.7) contrast(0.95)',
      cup: 'sepia(0.35) saturate(0.7) brightness(0.75) contrast(0.95)',
      star: 'sepia(0.55) saturate(0.6) brightness(0.55) contrast(0.95)',
      lamp: 'sepia(0.5) saturate(0.65) brightness(0.65) contrast(0.9)',
    };

    const differences = [
      {
        id: 'painting',
        left: { src: '/game/game3/painting-cropped.png', left: '7%', top: '21%', width: '12%', filter: filters.painting },
        right: { src: '/game/game3/white-painting-cropped.png', left: '7%', top: '21%', width: '12%', filter: filters.painting },
        hotspots: {
          left: { cx: '13%', cy: '26%', r: '7%' },
          right: { cx: '13%', cy: '26%', r: '7%' },
        },
      },
      {
        id: 'teacup',
        left: { src: '/game/game3/teacup-clear.png', left: '27%', top: '43%', width: '22%', filter: filters.cup },
        right: { src: '/game/game3/white-cup.png', left: '27%', top: '43%', width: '22%', blend: 'screen', filter: filters.cup },
        hotspots: {
          left: { cx: '38%', cy: '52%', r: '8%' },
          right: { cx: '38%', cy: '52%', r: '8%' },
        },
      },
      {
        id: 'star',
        left: { src: '/game/game3/star.png', left: '2%', top: '72%', width: '14%', blend: 'screen', filter: filters.star },
        right: { src: '/game/game3/star.png', left: '84%', top: '72%', width: '14%', blend: 'screen', filter: filters.star },
        hotspots: {
          left: { cx: '9%', cy: '79%', r: '7%' },
          right: { cx: '91%', cy: '79%', r: '7%' },
        },
      },
      {
        id: 'lamp',
        left: { src: '/game/game3/lamp-clear.png', left: '60%', top: '0%', width: '18%', filter: filters.lamp },
        right: { src: '/game/game3/desk-lamp-clear.png', left: '43%', top: '70%', width: '14%', filter: filters.lamp },
        hotspots: {
          left: { cx: '69%', cy: '13%', r: '10%' },
          right: { cx: '50%', cy: '79%', r: '8%' },
        },
      },
    ];

    const timerEl = document.getElementById('timer');
    const promptEl = document.getElementById('prompt');
    const progressEl = document.getElementById('progress');
    const overlay = document.getElementById('overlay');
    const result = document.getElementById('result');
    const resultTitle = document.getElementById('result-title');
    const resultText = document.getElementById('result-text');
    const resultBtn = document.getElementById('result-btn');
    const foundIds = new Set();

    let secondsLeft = TOTAL_SECONDS;
    let phase = 'finding';
    let timerId;

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return minutes + ':' + seconds;
    }

    function percentNumber(value) {
      return parseFloat(String(value).replace('%', ''));
    }

    function isInsideHotspot(hotspot, xPercent, yPercent) {
      const cx = percentNumber(hotspot.cx);
      const cy = percentNumber(hotspot.cy);
      const r = percentNumber(hotspot.r);
      return Math.hypot(xPercent - cx, yPercent - cy) <= r;
    }

    function renderPiece(container, variant) {
      const img = document.createElement('img');
      img.className = 'piece';
      img.src = variant.src;
      img.alt = '';
      img.style.left = variant.left;
      img.style.top = variant.top;
      img.style.width = variant.width;
      if (variant.blend) img.style.mixBlendMode = variant.blend;
      if (variant.filter) img.style.filter = variant.filter;
      container.appendChild(img);
    }

    function renderFoundCircle(container, hotspot) {
      const circle = document.createElement('div');
      circle.className = 'found-circle';
      circle.style.left = 'calc(' + hotspot.cx + ' - ' + hotspot.r + ')';
      circle.style.top = 'calc(' + hotspot.cy + ' - ' + hotspot.r + ')';
      circle.style.width = 'calc(' + hotspot.r + ' * 2)';
      circle.style.height = 'calc(' + hotspot.r + ' * 2)';
      container.appendChild(circle);
    }

    function renderProgress() {
      progressEl.textContent = '';
      for (let index = 0; index < TOTAL_DIFFERENCES; index += 1) {
        const lamp = document.createElement('span');
        lamp.className = 'lamp' + (index < foundIds.size ? ' on' : '');
        progressEl.appendChild(lamp);
      }
    }

    function renderPhotos() {
      document.querySelectorAll('.photo').forEach((photo) => {
        const side = photo.dataset.side;
        photo.textContent = '';

        const base = document.createElement('img');
        base.className = 'base';
        base.src = '/game/game3/cafe.png';
        base.alt = side === 'left' ? '左邊照片' : '右邊照片';
        photo.appendChild(base);

        differences.forEach((difference) => renderPiece(photo, difference[side]));
        differences
          .filter((difference) => foundIds.has(difference.id))
          .forEach((difference) => renderFoundCircle(photo, difference.hotspots[side]));

        if (phase === 'choosing') {
          const button = document.createElement('button');
          button.className = 'check-btn';
          button.type = 'button';
          button.textContent = 'Check';
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            handleCheck(side);
          });
          photo.appendChild(button);
        }
      });
    }

    function setPhase(nextPhase) {
      phase = nextPhase;
      document.body.classList.toggle('finding', phase === 'finding');
      document.body.classList.toggle('choosing', phase === 'choosing');
      promptEl.textContent = phase === 'finding'
        ? '請找出四處不同的地方，並找出正確的照片'
        : '請選出正確的照片';
      renderPhotos();
    }

    function handlePanelClick(event) {
      if (phase !== 'finding') return;
      const photo = event.currentTarget;
      const side = photo.dataset.side;
      const rect = photo.getBoundingClientRect();
      const xPercent = ((event.clientX - rect.left) / rect.width) * 100;
      const yPercent = ((event.clientY - rect.top) / rect.height) * 100;

      for (const difference of differences) {
        if (foundIds.has(difference.id)) continue;
        if (isInsideHotspot(difference.hotspots[side], xPercent, yPercent)) {
          foundIds.add(difference.id);
          renderProgress();
          renderPhotos();
          if (foundIds.size >= TOTAL_DIFFERENCES) setPhase('choosing');
          break;
        }
      }
    }

    function handleCheck(side) {
      if (phase !== 'choosing') return;
      if (side === CORRECT_SIDE) {
        finish(true, '判斷正確', '左邊照片才是真正可信的線索。');
      } else {
        finish(false, 'FAIL', '右邊照片被動過手腳，店長留下的假線索害你走錯方向。');
      }
    }

    function finish(success, title, text) {
      clearInterval(timerId);
      phase = success ? 'won' : 'lost';
      localStorage.setItem('pendingResult', success ? 'success' : 'fail');
      result.classList.toggle('fail-screen', !success);
      resultTitle.textContent = title;
      resultText.textContent = text;
      overlay.classList.add('show');
    }

    function tick() {
      secondsLeft = Math.max(0, secondsLeft - 1);
      timerEl.textContent = formatTime(secondsLeft);
      timerEl.classList.toggle('warning', secondsLeft <= 10);
      if (secondsLeft <= 0 && (phase === 'finding' || phase === 'choosing')) {
        finish(false, 'FAIL', '時間到了，還沒分辨出正確照片。');
      }
    }

    document.querySelectorAll('.photo').forEach((photo) => {
      photo.addEventListener('click', handlePanelClick);
    });

    resultBtn.addEventListener('click', () => {
      window.location.href = RETURN_TO;
    });

    timerEl.textContent = formatTime(secondsLeft);
    renderProgress();
    renderPhotos();
    timerId = setInterval(tick, 1000);
  </script>

  <!-- BGM：從主線 localStorage 繼續播放 -->
  <audio id="game-bgm" loop></audio>
  <script>
  (function initBgm() {
    const src = localStorage.getItem('bgmSrc');
    if (!src) return;
    const bgm = document.getElementById('game-bgm');
    bgm.src = src;
    bgm.volume = 0.5;
    bgm.play().catch(() => {
      document.addEventListener('click', () => bgm.play().catch(() => {}), { once: true });
    });
  })();
  </script>
</body>
</html>
