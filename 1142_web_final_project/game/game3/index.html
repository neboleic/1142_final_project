<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>第三關｜吧台照片找不同</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: #efe7d8;
      background:
        linear-gradient(rgba(18, 16, 18, .78), rgba(8, 9, 12, .9)),
        url("../../public/bar.png") center / cover no-repeat;
    }
    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 22px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(16, 18, 20, .82);
      border: 2px solid #07080a;
      box-shadow: 0 8px 24px rgba(0,0,0,.38), inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .title { font-size: clamp(18px, 2.2vw, 28px); font-weight: 900; letter-spacing: .12em; }
    .stats { display: flex; align-items: center; gap: 12px; font-weight: 900; }
    .badge {
      min-width: 84px;
      padding: 8px 12px;
      color: #16130f;
      text-align: center;
      background: #dfc47d;
      border: 2px solid #090909;
      border-radius: 8px;
    }
    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: center;
      min-height: 0;
    }
    .photo-card {
      position: relative;
      min-width: 0;
      background: rgba(28, 29, 31, .88);
      border: 3px solid #07080a;
      box-shadow: 10px 12px 0 rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.08);
      padding: 12px;
    }
    .photo-label {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 5;
      padding: 5px 10px;
      color: #16130f;
      background: #efe1c4;
      border: 2px solid #08090a;
      font-weight: 900;
      letter-spacing: .12em;
    }
    .photo {
      position: relative;
      aspect-ratio: 1024 / 682;
      overflow: hidden;
      border: 2px solid #090a0b;
      background: #111;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .fake-photo .wire {
      position: absolute;
      inset: 5% 6%;
      width: 88%;
      height: 90%;
      object-fit: fill;
      opacity: .36;
      mix-blend-mode: screen;
      filter: hue-rotate(130deg) saturate(1.4) brightness(1.15);
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      width: 8.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(239, 225, 196, .15);
      background: rgba(255,255,255,.01);
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
    .hotspot:hover { border-color: rgba(223, 196, 125, .85); }
    .hotspot.found {
      border-color: #8fcf9b;
      background: rgba(80, 180, 120, .28);
      box-shadow: 0 0 0 5px rgba(80,180,120,.16), 0 0 24px rgba(120,220,150,.55);
      pointer-events: none;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(16, 18, 20, .82);
      border: 2px solid #07080a;
    }
    .hint { color: #d8cfbd; line-height: 1.5; }
    button {
      min-width: 132px;
      padding: 11px 16px;
      color: #f2eadb;
      background: linear-gradient(#444947, #25292b);
      border: 2px solid #050607;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 4px 5px 0 rgba(0,0,0,.34);
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:not(:disabled):active { transform: translateY(3px); box-shadow: 1px 2px 0 rgba(0,0,0,.42); }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0,0,0,.78);
    }
    .overlay.show { display: grid; }
    .modal {
      width: min(520px, 92vw);
      padding: 28px;
      text-align: center;
      color: #17130f;
      background: #efe1c4;
      border: 3px solid #050607;
      box-shadow: 12px 14px 0 rgba(0,0,0,.35);
    }
    .modal h2 { margin: 0 0 12px; font-size: 30px; }
    .modal p { margin: 0 0 22px; line-height: 1.7; }
    .modal button { color: #efe7d8; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .stage { min-height: 100svh; padding: 14px; }
      .photos, .controls { grid-template-columns: 1fr; }
      .controls button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <header class="hud">
      <div class="title">吧台照片找不同</div>
      <div class="stats">
        <div class="badge">差異 <span id="found-count">0</span>/5</div>
        <div class="badge">時間 <span id="timer">90</span></div>
      </div>
    </header>

    <section class="photos">
      <article class="photo-card">
        <div class="photo-label">照片 A</div>
        <div class="photo">
          <img src="bg.png" alt="照片 A">
        </div>
      </article>
      <article class="photo-card">
        <div class="photo-label">照片 B</div>
        <div class="photo fake-photo" id="fake-photo">
          <img src="bg.png" alt="照片 B">
          <img class="wire" src="wireframe.png" alt="">
        </div>
      </article>
    </section>

    <footer class="controls">
      <div class="hint">先在照片 B 找出 5 個被店長動過手腳的地方，再選出真正可信的照片。</div>
      <button id="choose-a" disabled>選照片 A</button>
      <button id="choose-b" disabled>選照片 B</button>
    </footer>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <button id="result-btn">返回主線</button>
    </div>
  </div>

  <script>
    const TOTAL = 5;
    const LIMIT = 90;
    const RETURN_TO = '../../scene.html';
    const hotspots = [
      { x: 21, y: 28 },
      { x: 39, y: 18 },
      { x: 52, y: 47 },
      { x: 68, y: 31 },
      { x: 79, y: 65 },
    ];

    const fakePhoto = document.getElementById('fake-photo');
    const foundCount = document.getElementById('found-count');
    const timerEl = document.getElementById('timer');
    const chooseA = document.getElementById('choose-a');
    const chooseB = document.getElementById('choose-b');
    const overlay = document.getElementById('overlay');
    const resultTitle = document.getElementById('result-title');
    const resultText = document.getElementById('result-text');
    const resultBtn = document.getElementById('result-btn');

    let found = 0;
    let timeLeft = LIMIT;
    let done = false;

    hotspots.forEach((point) => {
      const btn = document.createElement('button');
      btn.className = 'hotspot';
      btn.type = 'button';
      btn.style.left = point.x + '%';
      btn.style.top = point.y + '%';
      btn.setAttribute('aria-label', '標記差異');
      btn.addEventListener('click', () => {
        if (done || btn.classList.contains('found')) return;
        btn.classList.add('found');
        found += 1;
        foundCount.textContent = String(found);
        if (found === TOTAL) {
          chooseA.disabled = false;
          chooseB.disabled = false;
        }
      });
      fakePhoto.appendChild(btn);
    });

    const timer = setInterval(() => {
      if (done) return;
      timeLeft -= 1;
      timerEl.textContent = String(timeLeft);
      if (timeLeft <= 10) timerEl.style.color = '#f07171';
      if (timeLeft <= 0) finish(false, '時間到了', '還沒分辨出正確照片，店長留下的假線索害你走錯方向。');
    }, 1000);

    chooseA.addEventListener('click', () => {
      finish(true, '判斷正確', '照片 A 才是真正可信的線索。你找到星星標記的位置了。');
    });
    chooseB.addEventListener('click', () => {
      finish(false, '判斷錯誤', '照片 B 被動過手腳，星星位置是假的。');
    });

    function finish(success, title, text) {
      if (done) return;
      done = true;
      clearInterval(timer);
      localStorage.setItem('pendingResult', success ? 'success' : 'fail');
      resultTitle.textContent = title;
      resultText.textContent = text;
      overlay.classList.add('show');
    }

    resultBtn.addEventListener('click', () => {
      window.location.href = RETURN_TO;
    });
  </script>
</body>
</html>
