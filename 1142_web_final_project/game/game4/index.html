<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>電流急急棒</title>
<link rel="stylesheet" href="/game/game4/style.css">
</head>
<body>

<div id="rotate-prompt">
  <p>請將手機橫置以獲得最佳體驗</p>
  <div class="rotate-icon">⟳</div>
</div>

<!-- ① 開始引導覆蓋層 -->
<div id="start-overlay">
  <div class="start-panel">
    <div class="start-deco-line"></div>
    <div class="start-title">—  電流急急棒  —</div>
    <div class="start-deco-line"></div>
    <p class="start-desc">
      將滑鼠（或手指）移至<br>
      <span class="start-highlight">起點圓圈</span><br>
      引導電棒穿越彎道至終點
    </p>
    <div class="start-hint">▼ 點擊任意處開始 ▼</div>
  </div>
</div>

<!-- ④ 自製放棄確認 Dialog -->
<div id="confirm-overlay">
  <div class="confirm-panel">
    <div class="confirm-deco"></div>
    <div class="confirm-title">確 認 放 棄</div>
    <p class="confirm-body">確定要放棄本次挑戰嗎？<br>將返回劇情。</p>
    <div class="confirm-buttons">
      <button id="btn-confirm-yes">確　定</button>
      <button id="btn-confirm-no">取　消</button>
    </div>
  </div>
</div>

<div id="flash-overlay"></div>

<div id="canvas-container">
  <canvas id="gameCanvas"></canvas>
  <div id="drawer-anim"></div>
</div>

<div id="win-screen">
  <div id="win-title">— 夾 層 彈 開 —</div>
  <div id="key-container">
    <svg width="160" height="70" viewBox="0 0 160 70" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="kg1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#ffe080"/>
          <stop offset="45%"  stop-color="#c89030"/>
          <stop offset="100%" stop-color="#7a5000"/>
        </linearGradient>
        <filter id="glow2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="32" cy="34" r="22" fill="none" stroke="url(#kg1)" stroke-width="8" filter="url(#glow2)"/>
      <circle cx="32" cy="34" r="11" fill="none" stroke="url(#kg1)" stroke-width="4"/>
      <circle cx="32" cy="34" r="5"  fill="#0f0802"/>
      <rect x="51" y="29" width="90" height="9" rx="4.5" fill="url(#kg1)" filter="url(#glow2)"/>
      <rect x="96"  y="38" width="9" height="14" rx="3" fill="url(#kg1)"/>
      <rect x="117" y="38" width="9" height="10" rx="3" fill="url(#kg1)"/>
      <rect x="136" y="38" width="8" height="16" rx="3" fill="url(#kg1)"/>
    </svg>
  </div>
  <div id="win-main">✦ 成功通關 ✦</div>
  <div id="win-sub">點擊鑰匙以繼續...</div>
</div>

<aside id="game-sidebar">

  <!-- ② 失敗計數器 -->
  <div class="deco-panel-outer">
    <div class="deco-panel-inner">
      <div class="deco-panel-header">失 敗 次 數</div>
      <div class="deco-panel-body fail-body">
        <span id="fail-count">0</span>
        <span class="fail-unit">次</span>
      </div>
    </div>
  </div>

  <!-- 遊戲說明 -->
  <div class="deco-panel-outer">
    <div class="deco-panel-inner">
      <div class="deco-panel-header">遊 戲 說 明</div>
      <div class="deco-panel-body">
        將滑鼠移至起點，操縱亮起的電棒，沿著淺色安全區至終點感應，夾層彈開即可拿到鑰匙
      </div>
    </div>
  </div>

  <!-- 放棄按鈕 -->
  <button id="btn-giveup" class="game-btn">
    <img src="/game/game4/button1.png" alt="">
    <span>放　棄</span>
  </button>
</aside>

<!-- ⑤ BGM -->
<audio id="game-bgm" loop></audio>

<script src="/game/game4/game.js"></script>
</body>
</html>
